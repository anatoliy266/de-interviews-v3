name: middle_data_engineer_task

x-configs: &airflow-base
  build:
    context: .
    dockerfile: airflow_image/Dockerfile
  env_file:
      - ./.env
  volumes:
    - ./conf/airflow.cfg:/opt/airflow/airflow.cfg:ro
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./etl:/opt/airflow/etl  
    - ./ml:/opt/airflow/ml         
    - ./utils:/opt/airflow/utils
  networks:
    - cluster
services:
  postgres:
    image: postgres:17
    container_name: de_postgres
    ports:
      - "5433:5432"
    env_file:
      - ./.env
    volumes:
      - de_postgres_data:/var/lib/postgresql/data
      - ./conf/postgresql.conf:/etc/postgresql.conf:ro
      - ./conf/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./sql:/docker-entrypoint-initdb.d:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d deals_bigdata -c \"SELECT 1 FROM pg_namespace WHERE nspname = 'ml';\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 180s
    restart: unless-stopped
    networks:
      - cluster

  airflow-init:
    container_name: de_airflow-init
    <<: *airflow-base
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "=== Airflow init started ==="
        airflow db migrate
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USERNAME}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email "$${AIRFLOW_ADMIN_EMAIL}" || echo "User already exists"
        echo "=== Airflow init completed ==="
    depends_on:
      postgres:
        condition: service_healthy
  airflow-api-server:
    container_name: de_airflow-api-server
    <<: *airflow-base
    restart: unless-stopped
    ports:
      - "8081:8080"
    command: airflow api-server --host 0.0.0.0
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    container_name: de_airflow-dag-processor
    <<: *airflow-base
    restart: unless-stopped
    command: airflow dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    container_name: de_airflow-scheduler
    <<: *airflow-base
    restart: unless-stopped
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  runner:
    build:
      context: .
      dockerfile: python_image/Dockerfile
    container_name: de_pipeline_runner
    env_file:
      - ./.env
    volumes:
      - ./etl:/app/etl  
      - ./ml:/app/ml         
      - ./utils:/app/utils
      - ./entry.py:/app/entry.py
      - ./models:/app/models
    networks:
      - cluster
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  de_postgres_data:

networks:
  cluster:
    external: true
